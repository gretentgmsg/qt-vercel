<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI机器人</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0e27;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            text-align: center;
        }

        .robot {
            font-size: 80px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            50% { transform: translateY(-15px); }
        }

        h1 {
            background: linear-gradient(90deg, #00ffff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="robot">🤖</div>
    <h1>AI 机器人</h1>
    <p>未来已来，探索人工智能的无限可能</p>
</body>
</html>
